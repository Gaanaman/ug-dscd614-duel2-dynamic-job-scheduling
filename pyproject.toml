[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "duel2"
version = "0.1.0"
description = "Dueling DQN for dynamic job scheduling on parallel machines (DSCD 614, Group 11)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
